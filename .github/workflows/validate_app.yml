name: Validate Booking App

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "app_v2.py"
      - "booking_core.py"
      - "booking_views.py"
      - "requirements.txt"
      - "validation_trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python files
        run: python -m py_compile app.py app_v2.py booking_core.py booking_views.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Smoke test Streamlit
        shell: bash
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /dev/null; then
              echo "Streamlit health check passed"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1
