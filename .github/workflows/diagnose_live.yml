name: Diagnose Live Streamlit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose_live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check live app
        shell: bash
        run: |
          set +e
          URL="https://seminar-booking-yreuvhphdhqjdumy3dvwkm.streamlit.app"
          echo "=== ROOT HEAD ==="
          curl -sS -I --max-time 20 "$URL/"
          echo "root_exit=$?"
          echo
          echo "=== FOLLOW REDIRECTS WITH COOKIE JAR ==="
          curl -sS -L \
            --max-redirs 12 \
            --max-time 30 \
            -c /tmp/streamlit.cookies \
            -b /tmp/streamlit.cookies \
            -o /tmp/body.html \
            -w 'final_http=%{http_code}\nfinal_url=%{url_effective}\nredirects=%{num_redirects}\n' \
            "$URL/"
          echo "follow_exit=$?"
          echo
          echo "=== CHROME RENDERED DOM ==="
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          echo "chrome=$CHROME_BIN"
          if [ -n "$CHROME_BIN" ]; then
            timeout 25s "$CHROME_BIN" \
              --headless \
              --disable-gpu \
              --no-sandbox \
              --disable-dev-shm-usage \
              --virtual-time-budget=12000 \
              --dump-dom \
              "$URL/" > /tmp/rendered.html 2>/tmp/chrome.err
            echo "chrome_exit=$?"
            echo "--- matching rendered text ---"
            if [ -s /tmp/rendered.html ]; then
              tr '<>' '\n\n' < /tmp/rendered.html | sed 's/&nbsp;/ /g' | grep -Ei '세미나|error|오류|sign in|login|access|sleep|wake|connection|streamlit' | head -n 120 || true
            else
              echo "No rendered DOM output"
            fi
            echo "--- chrome stderr ---"
            tail -n 80 /tmp/chrome.err || true
          else
            echo "No Chrome/Chromium found"
          fi
