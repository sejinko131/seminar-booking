name: Diagnose Live Streamlit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose_live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check live app
        shell: bash
        run: |
          set +e
          URL="https://seminar-booking-yreuvhphdhqjdumy3dvwkm.streamlit.app"
          echo "=== ROOT HEAD ==="
          curl -sS -I --max-time 30 "$URL/"
          echo "root_exit=$?"
          echo
          echo "=== FOLLOW REDIRECTS WITH COOKIE JAR ==="
          curl -sS -L \
            --max-redirs 12 \
            --max-time 60 \
            -c /tmp/streamlit.cookies \
            -b /tmp/streamlit.cookies \
            -o /tmp/body.html \
            -w 'final_http=%{http_code}\nfinal_url=%{url_effective}\nredirects=%{num_redirects}\n' \
            "$URL/"
          echo "follow_exit=$?"
          echo
          echo "=== CHROME RENDERED DOM ==="
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          echo "chrome=$CHROME_BIN"
          if [ -n "$CHROME_BIN" ]; then
            "$CHROME_BIN" \
              --headless \
              --disable-gpu \
              --no-sandbox \
              --disable-dev-shm-usage \
              --virtual-time-budget=15000 \
              --dump-dom \
              "$URL/" > /tmp/rendered.html 2>/tmp/chrome.err
            echo "chrome_exit=$?"
            echo "--- visible text hints ---"
            python - <<'PY'
from html.parser import HTMLParser
from pathlib import Path
class P(HTMLParser):
    def __init__(self):
        super().__init__(); self.parts=[]
    def handle_data(self,d):
        d=' '.join(d.split())
        if d: self.parts.append(d)
p=P(); p.feed(Path('/tmp/rendered.html').read_text(errors='ignore'))
text='\n'.join(p.parts)
for line in text.splitlines():
    low=line.lower()
    if any(k in low for k in ['세미나','error','오류','app','sign in','login','access','sleep','wake','connection','streamlit']):
        print(line[:500])
PY
            echo "--- chrome stderr ---"
            tail -n 80 /tmp/chrome.err || true
          else
            echo "No Chrome/Chromium found"
          fi
