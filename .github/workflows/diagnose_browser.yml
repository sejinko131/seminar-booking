name: Diagnose Live Browser

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - ".github/workflows/diagnose_browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Streamlit redeploy
        run: sleep 45
      - name: Install Playwright
        run: pip install playwright
      - name: Inspect live app in browser
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          url = "https://seminar-booking-yreuvhphdhqjdumy3dvwkm.streamlit.app/"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, executable_path="/usr/bin/google-chrome", args=["--no-sandbox", "--disable-dev-shm-usage"])
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              console = []
              errors = []
              bad_responses = []
              failed_requests = []
              page.on("console", lambda msg: console.append(f"{msg.type}: {msg.text}"))
              page.on("pageerror", lambda exc: errors.append(str(exc)))
              page.on("response", lambda res: bad_responses.append(f"{res.status} {res.request.resource_type} {res.url}") if res.status >= 400 else None)
              page.on("requestfailed", lambda req: failed_requests.append(f"{req.resource_type} {req.url} :: {req.failure}"))
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=45000)
                  page.wait_for_timeout(25000)
                  print("FINAL_URL:", page.url)
                  print("TITLE:", page.title())
                  print("FRAMES_START")
                  for i, frame in enumerate(page.frames):
                      print(f"FRAME {i}: {frame.url}")
                      try:
                          txt = frame.locator("body").inner_text(timeout=5000)
                          print(f"FRAME {i} BODY_START")
                          print(txt[:10000])
                          print(f"FRAME {i} BODY_END")
                      except Exception as e:
                          print(f"FRAME {i} BODY_ERROR: {e}")
                  print("FRAMES_END")
                  print("BAD_RESPONSES_START")
                  for line in bad_responses[-100:]: print(line)
                  print("BAD_RESPONSES_END")
                  print("FAILED_REQUESTS_START")
                  for line in failed_requests[-100:]: print(line)
                  print("FAILED_REQUESTS_END")
                  print("CONSOLE_START")
                  for line in console[-100:]: print(line)
                  print("CONSOLE_END")
                  print("PAGEERROR_START")
                  for line in errors[-100:]: print(line)
                  print("PAGEERROR_END")
              finally:
                  browser.close()
          PY
