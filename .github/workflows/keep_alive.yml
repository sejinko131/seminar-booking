name: Keep Streamlit App Awake

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep_alive.yml"
  schedule:
    # GitHub Actions cron uses UTC. Run every 6 hours.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Streamlit app
        shell: bash
        run: |
          URL="https://seminar-booking-yreuvhphdhqjdumy3dvwkm.streamlit.app/"
          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 10 \
            --max-time 60 \
            --user-agent "seminar-booking-keepalive/1.0" \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$URL")

          echo "HTTP status: $HTTP_CODE"

          if [[ "$HTTP_CODE" =~ ^[23][0-9][0-9]$ ]]; then
            echo "Streamlit app ping completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            exit 0
          fi

          echo "Unexpected HTTP status: $HTTP_CODE"
          exit 1
