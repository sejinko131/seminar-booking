name: Probe Streamlit Backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe_stcore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe backend endpoints
        shell: bash
        run: |
          set +e
          URL="https://seminar-booking-yreuvhphdhqjdumy3dvwkm.streamlit.app"
          COOKIE=/tmp/streamlit.cookies
          echo "=== establish session ==="
          curl -sS -L --max-redirs 12 --max-time 30 -c "$COOKIE" -b "$COOKIE" -o /dev/null -w 'root %{http_code} %{url_effective}\n' "$URL/"
          for PATH_ in "/_stcore/health" "/~/+/_stcore/health" "/~/+/_stcore/host-config" "/_stcore/host-config" "/~/+/"; do
            echo
            echo "=== $PATH_ ==="
            curl -sS -L --max-redirs 8 --max-time 20 -c "$COOKIE" -b "$COOKIE" -D - "$URL$PATH_" -o /tmp/out.txt
            CODE=$?
            echo "curl_exit=$CODE"
            echo "--- body ---"
            head -c 3000 /tmp/out.txt || true
            echo
          done
